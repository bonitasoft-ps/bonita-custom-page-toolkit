    <!-- frame-ancestors is intentionally omitted: browsers ignore it when delivered
         via <meta> and only honour the HTTP header. Bonita controls iframe embedding
         at the response-header level, so dropping it here removes a console warning. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; base-uri 'self'; form-action 'self'" />
  </head>

  </body>
